# Eval smoke: 3 fixture variants over the in-repo test slice. Zero API
# spend, zero GPU. Validates the three-way pipeline (load cases → run
# variant → summarize → comparison JSON) without exercising real predictors.
test_jsonl = "tests/data/fixtures/eval/test_cases.jsonl"
output_dir = "results/eval/smoke"

[[variant]]
name = "base"
predictor = "fixture"
fixtures_path = "tests/data/fixtures/eval/predictions_invalid.jsonl"

[[variant]]
name = "finetuned"
predictor = "fixture"
fixtures_path = "tests/data/fixtures/eval/predictions_perfect.jsonl"

[[variant]]
name = "gpt-4o"
predictor = "fixture"
fixtures_path = "tests/data/fixtures/eval/predictions_perfect.jsonl"
